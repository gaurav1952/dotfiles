"$schema" = 'https://starship.rs/config-schema.json'
palette = "noctalia"

add_newline = true
command_timeout = 1000
scan_timeout = 30

format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$fill\
$cmd_duration\
$line_break\
$character"""

right_format = """
$python\
$nodejs\
$rust\
$golang\
$php\
$docker_context\
"""

# ─────────────────────────────────────────────
# OS
# ─────────────────────────────────────────────

[os.symbols]
Arch = "󰣇 "
CachyOS = " "
Ubuntu = "󰕈 "
Debian = "󰣚 "
Fedora = "󰣛 "
NixOS = "󱄅 "
Windows = "󰍲 "

[os]
disabled = false
style = "bold purple"

# ─────────────────────────────────────────────
# USER
# ─────────────────────────────────────────────

[username]
show_always = false
style_user = "bold lavender"
style_root = "bold red"
format = "[$user]($style) "

# ─────────────────────────────────────────────
# HOSTNAME
# ─────────────────────────────────────────────

[hostname]
ssh_only = true
format = "[@$hostname](bold lavender) "
trim_at = "."
disabled = false

# ─────────────────────────────────────────────
# DIRECTORY
# ─────────────────────────────────────────────

[directory]
style = "bold blue"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncate_to_repo = true
home_symbol = "~"
read_only = " 󰌾"
read_only_style = "red"

# ─────────────────────────────────────────────
# GIT
# ─────────────────────────────────────────────

[git_branch]
symbol = "󰘬 "
style = "bold mauve"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold red"
format = "([$all_status$ahead_behind]($style)) "

conflicted = "󰞇 "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "󰹹 ⇡${ahead_count} ⇣${behind_count} "

untracked = "?${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

# ─────────────────────────────────────────────
# FILL
# ─────────────────────────────────────────────

[fill]
symbol = " "

# ─────────────────────────────────────────────
# COMMAND DURATION
# ─────────────────────────────────────────────

[cmd_duration]
min_time = 2000
format = "took [$duration](bold yellow) "

# ─────────────────────────────────────────────
# PROMPT CHARACTER
# ─────────────────────────────────────────────

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"

# ─────────────────────────────────────────────
# PYTHON
# ─────────────────────────────────────────────

[python]
symbol = "󰌠 "
style = "bold yellow"
format = "[$symbol$pyenv_prefix$version(\\($virtualenv\\))]($style) "
pyenv_version_name = true
python_binary = ["python3", "python"]

# ─────────────────────────────────────────────
# NODE
# ─────────────────────────────────────────────

[nodejs]
symbol = "󰎙 "
style = "bold green"
format = "[$symbol$version]($style) "

# ─────────────────────────────────────────────
# RUST
# ─────────────────────────────────────────────

[rust]
symbol = "󱘗 "
style = "bold red"
format = "[$symbol$version]($style) "

# ─────────────────────────────────────────────
# GO
# ─────────────────────────────────────────────

[golang]
symbol = "󰟓 "
style = "bold cyan"
format = "[$symbol$version]($style) "

# ─────────────────────────────────────────────
# PHP
# ─────────────────────────────────────────────

[php]
symbol = "󰌟 "
style = "bold blue"
format = "[$symbol$version]($style) "

# ─────────────────────────────────────────────
# DOCKER
# ─────────────────────────────────────────────

[docker_context]
symbol = "󰡨 "
style = "bold blue"
format = "[$symbol$context]($style) "

# ─────────────────────────────────────────────
#  NIX_SHELL
# ─────────────────────────────────────────────
[nix_shell]
disabled = false
format = 'via [❄️ $state( \($name\))]($style) '
impure_msg = '[impure]'
pure_msg = '[pure]'
style = 'bold blue'

# ─────────────────────────────────────────────
# TIME
# ─────────────────────────────────────────────

[time]
disabled = false
format = "[$time]($style) "
time_format = "%H:%M"
style = "bold lavender"

# ─────────────────────────────────────────────
# BATTERY
# ─────────────────────────────────────────────

[battery]
disabled = false

[[battery.display]]
threshold = 20
style = "bold red"

[[battery.display]]
threshold = 50
style = "bold yellow"

[[battery.display]]
threshold = 100
style = "bold green"

# ─────────────────────────────────────────────
# STATUS
# ─────────────────────────────────────────────

[status]
disabled = false
symbol = "✘ "
style = "bold red"
format = "[$symbol$status]($style) "

# ─────────────────────────────────────────────
# PACKAGE
# ─────────────────────────────────────────────

[package]
disabled = true

