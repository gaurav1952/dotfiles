# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER+SHIFT,r,reload_config

# menu , terminal and vicinae
bind=SUPER,Return,spawn,kitty
bind=SUPER,space,spawn,rofi -show drun
bind=SUPER,D,spawn,vicinae toggle

# exit
bind=SUPER+SHIFT,m,quit
bind=SUPER,q,killclient,

# switch window focus
bind=SUPER,Tab,focusstack,next
#bind=ALT,Left,focusdir,left
#bind=ALT,Right,focusdir,right
#bind=ALT,Up,focusdir,up
#bind=ALT,Down,focusdir,down

bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right

# swap window
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right

# switch window status
bind=SUPER+SHIFT,g,toggleglobal,
bind=ALT,Tab,toggleoverview,
bind=SUPER,f,togglefloating,
bind=ALT,a,togglemaximizescreen,
bind=ALT,f,togglefullscreen,
bind=ALT+SHIFT,f,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=ALT,z,toggle_scratchpad

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,

# switch layout
# bind=ALT,n,switch_layout
bind=Alt,n,spawn,~/.config/mango/scripts/layout-notify.sh
bind=Alt+Shift,n,spawn,~/.config/mango/scripts/layout-notify-reverse.sh
# tag switching with h , l
bind=Ctrl+ALT,h,viewtoleft,0
bind=Ctrl+ALT,l,viewtoright,0

# tag switch
bind=SUPER,Left,viewtoleft,0
bind=CTRL,Left,viewtoleft_have_client,0
bind=SUPER,Right,viewtoright,0
bind=CTRL,Right,viewtoright_have_client,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

# gestures
gesturebind=none,left,3,viewtoleft_have_client
gesturebind=none,right,3,viewtoright_have_client
gesturebind=none,up,3,toggleoverview
gesturebind=none,down,3,toggleoverview

#volume
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
#brightness
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set 5%+
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-

bind=Ctrl,1,view,1,0
bind=Ctrl,2,view,2,0
bind=Ctrl,3,view,3,0
bind=Ctrl,4,view,4,0
bind=Ctrl,5,view,5,0
bind=Ctrl,6,view,6,0
bind=Ctrl,7,view,7,0
bind=Ctrl,8,view,8,0
bind=Ctrl,9,view,9,0


# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=Alt,1,tag,1,0
bind=Alt,2,tag,2,0
bind=Alt,3,tag,3,0
bind=Alt,4,tag,4,0
bind=Alt,5,tag,5,0
bind=Alt,6,tag,6,0
bind=Alt,7,tag,7,0
bind=Alt,8,tag,8,0
bind=Alt,9,tag,9,0

# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# movewin
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# resizewin
bind=SUPER+ALT,k,resizewin,+0,-50
bind=SUPER+ALT,j,resizewin,+0,+50
bind=SUPER+ALT,h,resizewin,-50,+0
bind=SUPER+ALT,l,resizewin,+50,+0

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize


# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client


# Screenshot and basic stuff
bind=NONE,Print,spawn_shell,FILE=~/Pictures/Screenshots/shot_$(date +%F_%H-%M-%S).png && grim - | satty --filename - --output-filename "$FILE" --early-exit && wl-copy --type image/png < "$FILE"
bind=SUPER+SHIFT,s,spawn_shell,FILE=~/Pictures/Screenshots/shot_$(date +%F_%H-%M-%S).png && grim -g "$(slurp)" - | satty --filename - --output-filename "$FILE" --early-exit && wl-copy --type image/png < "$FILE"

#project and dotfiles
bind = SUPER+SHIFT, P,    spawn_shell, ~/.config/fuzzel/scripts/project.sh
bind = SUPER+SHIFT, d , spawn_shell , ~/.config/fuzzel/scripts/dotfiles.sh


# Noctalia shell
# bind=SUPER,X,spawn_shell, qs -c noctalia-shell ipc call sessionMenu toggle
bind=SUPER,X,spawn_shell, noctalia msg panel-toggle session
# bind=SUPER+SHIFT,W,spawn_shell, qs -c noctalia-shell ipc call plugin:wallcards toggle
bind=SUPER+SHIFT,W,spawn_shell, noctalia msg panel-toggle wallpaper
#bind=SUPER+SHIFT,V,spawn_shell, qs -c noctalia-shell ipc call launcher clipboard
bind=SUPER+SHIFT,V,spawn_shell, vicinae vicinae://launch/clipboard/history
bind=SUPER,comma,spawn,noctalia msg settings-toggle
bind=SUPER,n,spawn_shell,noctalia msg panel-toggle control-center

# application
bind=SUPER,e,spawn,thunar
bind=SUPER,b,spawn,brave
