###############################
###   WORKSPACE             ###
###############################

workspace = 1, layout:dwindle
workspace = 2, layout:master
workspace = 3, layout:scrolling
workspace = 4, layout:scrolling
workspace = 5, layout:dwindle

windowrule {
    name = float-workspace-6
    match:workspace = 6
    float = yes
    center = true
    size = 900 700
    animation = popin
}
# Windows rule for opening application on there respective workplaces and move the focus there

# windowrule = workspace 1, match:class kitty
windowrule = workspace 2, match:class brave-browser
windowrule = workspace 2, match:class zen
windowrule = workspace 3, match:class dev.zed.Zed
windowrule = workspace 4, match:class thunar
windowrule = workspace 7, match:class Logseq

workspace = w[tv1], bordersize:0

windowrule {
    name = no-decorations
    match:class = ^brave-browser$
    match:title = brave-cinhimbnkkaeohfgghhklpknlkffjgod-Default
    decorate = false

}

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrules that are useful

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

#special scratchpad

windowrule {
    name = term
    match:class = ^(kitty-scratch)$
    workspace = special:term
}



# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run
    match:class = hyprland-run
    move = 20 monitor_h-120
    float = yes
}
windowrule {
    name = float-window-satty
    match:class = com.gabm.satty
    float = yes
    center = true
    size = 900 700
    animation = popin
}




# open floating windows for saving-file and other stuff
windowrule {
    name = float-window-save
    match:title = Save
    float = yes
    center = true
    move = onscreen cursor -50% -50%
    animation = popin
}

