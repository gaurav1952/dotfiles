###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod SHIFT, F, togglefloating,
bind = $mainMod, D, exec, $menu
bind = $mainMod, space, exec, fuzzel
bind = $mainMod, P, pseudo, # dwindle
# bind = $mainMod, J, togglesplit, # dwindle

# Move focus with SUPER + hjkl (Vim style)
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Move windows — SUPER + SHIFT + hjkl
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# Resize windows — SUPER + CTRL + hjkl
bind = $mainMod CTRL, H, resizeactive, -40 0
bind = $mainMod CTRL, L, resizeactive,  40 0
bind = $mainMod CTRL, K, resizeactive,  0 -40
bind = $mainMod CTRL, J, resizeactive,  0  40

# Cycle workspaces — SUPER + ALT + hjkl
bind = $mainMod ALT, H, workspace, e-1
bind = $mainMod ALT, L, workspace, e+1

# my keybinds
bind = $mainMod, F, fullscreen, 1
bind = $mainMod SHIFT, B, exec, ~/.config/waybar/scripts/launch.sh
bind = $mainMod, N, exec, swaync-client -t
#bind = $mainMod SHIFT, S, exec, bash -c 'FILE=~/Pictures/Screenshots/shot_$(date +%F_%H-%M-%S).png && grim -g "$(slurp)" - | satty --filename - --output-filename "$FILE" --early-exit && wl-copy --type image/png < "$FILE"'
bind = ,Print, exec, bash -c 'FILE=~/Pictures/Screenshots/shot_$(date +%F_%H-%M-%S).png && grim - | satty --filename - --output-filename "$FILE" --early-exit && wl-copy --type image/png < "$FILE"'
bindl =,switch:on:Lid Switch, exec, loginctl lock-session
bind = $mainMod SHIFT, Return, exec, hyprlock
# bind = SUPER SHIFT, W, exec, ~/.config/rofi/scripts/wallpaper.sh
bind = SUPER SHIFT, T, exec, normcap
# bind = $mainMod,D, exec, vicinae toggle
# bind = $mainMod, space,      exec, ~/.config/rofi/scripts/launcher.sh
# bind = $mainMod SHIFT, V,    exec, ~/.config/rofi/scripts/clipboard.sh
bind = $mainMod ALT, W,          exec, ~/.config/rofi/scripts/wifi.sh
bind = $mainMod, B,          exec, ~/.config/rofi/scripts/bluetooth.sh
bind = $mainMod SHIFT, P,    exec, ~/.config/fuzzel/scripts/project.sh
# bind = $mainMod SHIFT, D,    exec, ~/.config/rofi/scripts/dotfiles.sh
bind = $mainMod SHIFT, d , exec , ~/.config/fuzzel/scripts/dotfiles.sh

#noctalia-shell
bind = $mainMod, T, exec, qs -c noctalia-shell ipc call settings toggle
# bind = $mainMod, D, exec, qs -c noctalia-shell ipc call launcher toggle #"Launcher"
bind = $mainMod SHIFT, V, exec, qs -c noctalia-shell ipc call launcher clipboard
bind = $mainMod, N, exec, qs -c noctalia-shell ipc call notifications toggleHistory
bind = $mainMod, X, exec, qs -c noctalia-shell ipc call sessionMenu toggle
bind = $mainMod, F12, exec, qs -c noctalia-shell ipc call lockScreen lock
bind = $mainMod SHIFT, W, exec, qs -c noctalia-shell ipc call plugin:wallcards toggle
bind = $mainMod SHIFT, Y, exec, qs -c noctalia-shell ipc call plugin:wallcards toggle


# pluging keybind 
#bind = $mainMod, g, exec, qs ipc -c overview call overview toggle
bind = $mainMod, g, exec,qs -c noctalia-shell ipc call plugin:workspace-overview toggle 

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
 bind = $mainMod, grave, togglespecialworkspace, magic
 bind = $mainMod ALT, grave, movetoworkspace, special:magic
# bind = $mainMod, grave, togglespecialworkspace, term

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous


# Chaining keybind for toolkit and screenshot 
# Using submaps
bind = $mainMod SHIFT, S, submap, screen

submap = screen
bind = , O, exec, qs -c noctalia-shell ipc call plugin:screen-toolkit ocr
bind = , L, exec, qs -c noctalia-shell ipc call plugin:screen-toolkit lens
bind = , S, exec, bash -c 'FILE=~/Pictures/Screenshots/shot_$(date +%F_%H-%M-%S).png && grim -g "$(slurp)" - | satty --filename - --output-filename "$FILE" --early-exit && wl-copy --type image/png < "$FILE"'
bind = , escape, submap, reset

submap = reset

