# bind = $mainMod SHIFT, L, exec, qs -c noctalia-shell ipc call plugin:screen-toolkit lens
# bind = $mainMod SHIFT, J, exec, bash -c 'FILE=~/Pictures/Screenshots/shot_$(date +%F_%H-%M-%S).png && grim -g "$(slurp)" - | satty --filename - --output-filename "$FILE" --early-exit && wl-copy --type image/png < "$FILE"'