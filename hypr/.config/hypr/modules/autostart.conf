#################
### AUTOSTART ###
#################


# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
exec-once = nm-applet &
# exec-once =  waybar
# exec-once = swaync
# exec-once = swww-daemon
# exec-once = hypridle
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = ~/.config/hypr/scripts/swww-restore.sh
exec-once = /usr/lib/hyprpolkitagent/hyprpolkitagent
exec-once = ~/.config/waybar/scripts/mpris-watch.sh
exec-once = kdeconnectd
exec-once = vicinae server
exec-once = hyprpm reload
# exec-once = quickshell
exec-once = qs -c noctalia-shell --no-duplicate
exec-once = qs -c overview
# exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP DISPLAY