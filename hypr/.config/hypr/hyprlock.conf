# ┌─────────────────────────────────────────────────────────────────┐
# │                   hyprlock.conf — glassmorphism                 │
# │         colors from matugen → hyprlock-colors.conf              │
# └─────────────────────────────────────────────────────────────────┘

source = ~/.config/hypr/hyprlock-colors.conf

general {
    disable_loading_bar  = true
    grace                = 0
    hide_cursor          = true
    no_fade_in           = false
    no_fade_out          = false
    ignore_empty_input   = true
}

# ─── Background ─────────────────────────────────────────────────────

background {
    monitor           =
    path              = screenshot
    blur_passes       = 3
    blur_size         = 7
    noise             = 0.0117
    contrast          = 0.9
    brightness        = 0.72
    vibrancy          = 0.15
    vibrancy_darkness = 0.0
}

# ─── Glass card ─────────────────────────────────────────────────────

shape {
    monitor      =
    size         = 420, 580
    color        = $cl_surface
    rounding     = 24
    border_size  = 1
    border_color = $cl_outline
    position     = 0, 0
    halign       = center
    valign       = center
    shadow_passes = 4
    shadow_size   = 20
    shadow_color  = rgba(00000055)
    shadow_boost  = 1.4
}

# ─── Clock ──────────────────────────────────────────────────────────

label {
    monitor     =
    text        = cmd[update:1000] date +'%H:%M'
    color       = $cl_on_surface
    font_size   = 86
    font_family = JetBrainsMono Nerd Font Bold
    position    = 0, 165
    halign      = center
    valign      = center
    shadow_passes = 2
    shadow_size   = 10
    shadow_color  = rgba(00000055)
}

# ─── Date ───────────────────────────────────────────────────────────

label {
    monitor     =
    text        = cmd[update:60000] date +'%A, %B %-d'
    color       = $cl_primary
    font_size   = 16
    font_family = JetBrainsMono Nerd Font
    position    = 0, 75
    halign      = center
    valign      = center
}

# ─── Greeting ───────────────────────────────────────────────────────

label {
    monitor     =
    text        = 󱦖  hey, $USER
    color       = $cl_secondary
    font_size   = 14
    font_family = JetBrainsMono Nerd Font
    position    = 0, 32
    halign      = center
    valign      = center
}

# ─── Media player ───────────────────────────────────────────────────

label {
    monitor     =
    text        = cmd[update:2000] bash -c "t=\$(playerctl metadata --format '󰎆  {{ artist }} — {{ title }}' 2>/dev/null); [ -n \"\$t\" ] && echo \"\${t:0:38}\" || echo ''"
    color       = $cl_on_surface_var
    font_size   = 12
    font_family = JetBrainsMono Nerd Font Italic
    position    = 0, -12
    halign      = center
    valign      = center
}

# ─── Input field ────────────────────────────────────────────────────

input-field {
    monitor  =
    size     = 320, 50

    outline_thickness = 2
    dots_size         = 0.28
    dots_spacing      = 0.20
    dots_center       = true
    dots_rounding     = -1

    outer_color      = $cl_primary_dim
    inner_color      = $cl_surface_variant
    font_color       = $cl_on_surface

    fade_on_empty    = true
    fade_timeout     = 1500
    placeholder_text = <span foreground="$cl_on_surface_var"> 󰌾  enter password…</span>

    rounding         = 14
    check_color      = $cl_tertiary
    fail_color       = $cl_error
    capslock_color   = $cl_secondary
    fail_text        = <i>wrong password ($ATTEMPTS)</i>

    position     = 0, -100
    halign       = center
    valign       = center
    shadow_passes = 3
    shadow_size   = 8
    shadow_color  = rgba(00000035)
    shadow_boost  = 1.2
}

# ─── Caps lock hint ─────────────────────────────────────────────────

label {
    monitor     =
    text        = cmd[update:1000] bash -c "b=\$(cat /sys/class/leds/input*::capslock/brightness 2>/dev/null | head -1); [ \"\$b\" = '1' ] && echo '  CAPS LOCK' || echo ''"
    color       = $cl_secondary
    font_size   = 11
    font_family = JetBrainsMono Nerd Font
    position    = 0, -168
    halign      = center
    valign      = center
}